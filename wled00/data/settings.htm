<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
	<title>LED4YOU Settings</title>
	<script>
		// load common.js with retry on error
		(function loadFiles() {
			const l = document.createElement('script');
			l.src = 'common.js';
			// note: loading style.css here causes ugly white button flashes so @import url("style.css") below inlines it for this page (only costs ~30bytes of flash)
			l.onload = () => {
				getLoc();
				loadJS(getURL('/settings/s.js?p=0'), false);
			};
			l.onerror = () => setTimeout(loadFiles, 100);
			document.head.appendChild(l);
		})();
	</script>
	<style>
		@import url("style.css");
		body {
			margin: 0 auto;
			max-width: 560px;
			padding: 0 16px 24px;
			line-height: 1.3;
		}
		.l4yh {
			display: flex; align-items: center; justify-content: space-between;
			padding: 18px 2px 14px;
		}
		.l4yh .logo { font-weight: 800; font-size: 22px; letter-spacing: 2px; }
		.l4yh .logo b { background: linear-gradient(90deg, #ff2e93, #8b5cff, #00d4ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
		.l4yh .sub { color: #8b93a8; font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; }
		.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
		button {
			display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
			gap: 14px; margin: 0; width: 100%; min-height: 104px; padding: 14px;
			text-align: left; font-size: 16px; font-weight: 600; line-height: 1.2;
			background: #171a22 !important; border: 1px solid #20242f !important; border-radius: 20px !important;
			box-shadow: 0 6px 20px -12px rgba(0,0,0,.6);
		}
		button:hover { border-color: #8b5cff !important; background: #1d212b !important; filter: none; }
		button i {
			font-style: normal; font-size: 20px; width: 40px; height: 40px; border-radius: 12px;
			display: flex; align-items: center; justify-content: center; background: #20242f;
		}
		#b { flex-direction: row; align-items: center; justify-content: center; min-height: 0; width: auto; padding: 8px 16px; font-size: 14px; border-radius: 999px !important; }
	</style>
</head>
<body>
<div class="l4yh"><div><div class="logo">LED<b>4</b>YOU</div><div class="sub">Settings</div></div><button type=submit id="b" onclick="window.location=getURL('/')">&#8592; Back</button></div>
<div class="grid">
<button type="submit" onclick="window.location=getURL('/settings/wifi')"><i>&#128246;</i>WiFi & Network</button>
<button type="submit" onclick="window.location=getURL('/settings/leds')"><i>&#128161;</i>LED & Hardware</button>
<button type="submit" onclick="window.location=getURL('/settings/pins')"><i>&#128204;</i>Pin Info</button>
<button id="2dbtn" type="submit" onclick="window.location=getURL('/settings/2D')"><i>&#9638;</i>2D Configuration</button>
<button type="submit" onclick="window.location=getURL('/settings/ui')"><i>&#127912;</i>User Interface</button>
<button id="dmxbtn" style="display:none;" type="submit" onclick="window.location=getURL('/settings/dmx')"><i>&#127899;</i>DMX Output</button>
<button type="submit" onclick="window.location=getURL('/settings/sync')"><i>&#128260;</i>Sync Interfaces</button>
<button type="submit" onclick="window.location=getURL('/settings/time')"><i>&#9200;</i>Time & Macros</button>
<button type="submit" onclick="window.location=getURL('/settings/um')"><i>&#129513;</i>Usermods</button>
<button type="submit" onclick="window.location=getURL('/settings/sec')"><i>&#128274;</i>Security & Updates</button>
</div>
</body>
</html>
